<h2>{{ receipt.title }}</h2>

<p>Total: {{ receipt.total_amount }}</p>
<p>Time: {{ receipt.receipt_time|date:"d/m/Y H:i" }}</p>

<h3>Participants</h3>

<ul>
  {% for p in participants %}
    <li>
      {{ p.user.username }}:
      Paid {{ p.amount_paid }} |
      Owes {{ p.amount_owed }}
    </li>
  {% endfor %}
</ul>

<br>

<a href="{% url 'edit_receipt' receipt.id %}">Edit Receipt</a>
<a href="{% url 'dashboard' %}">Back</a>
